# Freshly published prerelease host packages this plugin builds and tests
# against. pnpm's minimum-release-age gate (where a machine configures one)
# refuses them until they age out, so each exact version is listed here. The
# list is exactly the transitive @deepseek-ai closure of `cordis` + `dsh-llm`,
# recomputed from the host's own package.json files after each DSH upgrade.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.4'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/dsh-brand@0.1.7-rc.2'
  - '@deepseek-ai/dsh-llm@0.1.7-rc.2'
  - '@deepseek-ai/dsh-timeout@0.1.7-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.1.7-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.1.7-rc.2'
  - '@deepseek-ai/dsh-util-values@0.1.7-rc.2'
  - '@deepseek-ai/schemastery@3.18.4'
