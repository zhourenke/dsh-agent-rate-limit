# Host packages this plugin builds and tests against across its supported
# dual-baseline window (0.2.0-rc.2 and 0.2.1-rc.2). pnpm's supply-chain
# release-age gate refuses freshly published prereleases until they age out,
# so each exact version is listed here. The list represents the transitive
# @deepseek-ai closure of `cordis` + `dsh-llm` for both baselines.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.4'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/dsh-brand@0.2.0-rc.2 || 0.2.1-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.0-rc.2 || 0.2.1-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.0-rc.2 || 0.2.1-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.0-rc.2 || 0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.0-rc.2 || 0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.0-rc.2 || 0.2.1-rc.2'
  - '@deepseek-ai/schemastery@3.18.4'
